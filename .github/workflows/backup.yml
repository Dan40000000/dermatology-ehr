name: Automated Database Backup

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    name: Backup Production Database
    runs-on: ubuntu-latest
    environment: production
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      BACKUP_RETENTION_DAYS: 90
      BACKUP_ENCRYPTION_ENABLED: 'true'
      POSTGRES_CLIENT_MAJOR: '18'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: restore_verifier
          POSTGRES_PASSWORD: restore_verifier_password
          POSTGRES_DB: derm_restore_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore_verifier -d derm_restore_verify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate production backup configuration
        shell: bash
        env:
          AWS_BACKUP_ROLE_ARN: ${{ secrets.AWS_BACKUP_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_KMS_KEY_ID: ${{ secrets.BACKUP_KMS_KEY_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in AWS_BACKUP_ROLE_ARN AWS_REGION DATABASE_URL BACKUP_BUCKET BACKUP_ENCRYPTION_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Production backup configuration is incomplete. Missing GitHub environment secret(s): ${missing[*]}"
            exit 1
          fi

          if ! [[ "${BACKUP_RETENTION_DAYS:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::BACKUP_RETENTION_DAYS must be configured as a positive integer"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BACKUP_ROLE_ARN }}
          role-session-name: dermatology-ehr-production-backup
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y "postgresql-client-${POSTGRES_CLIENT_MAJOR}"
          echo "/usr/lib/postgresql/${POSTGRES_CLIENT_MAJOR}/bin" >> "$GITHUB_PATH"
          "/usr/lib/postgresql/${POSTGRES_CLIENT_MAJOR}/bin/pg_dump" --version

      - name: Run backup script
        run: |
          chmod +x ./scripts/backup.sh
          ./scripts/backup.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_KMS_KEY_ID: ${{ secrets.BACKUP_KMS_KEY_ID }}
          BACKUP_ENCRYPTION_ENABLED: ${{ env.BACKUP_ENCRYPTION_ENABLED }}
          BACKUP_KEEP_LOCAL: true

      - name: Verify backup
        run: |
          LATEST_BACKUP=$(aws s3 ls s3://${{ secrets.BACKUP_BUCKET }}/backups/ --recursive | sort | tail -n 1 | awk '{print $4}')
          echo "Latest backup: $LATEST_BACKUP"

          BACKUP_SIZE=$(aws s3 ls s3://${{ secrets.BACKUP_BUCKET }}/$LATEST_BACKUP | awk '{print $3}')
          echo "Backup size: $BACKUP_SIZE bytes"

          if [ "$BACKUP_SIZE" -lt 1000 ]; then
            echo "Error: Backup file is too small, may be corrupt"
            exit 1
          fi

      - name: Restore backup into disposable PostgreSQL
        run: |
          LATEST_LOCAL_BACKUP="$(find ./backups -type f -name 'derm_db_backup_*.sql.gz*' -print | sort | tail -n 1)"
          if [ -z "$LATEST_LOCAL_BACKUP" ]; then
            echo "No local backup was retained for restore verification"
            exit 1
          fi
          chmod +x ./scripts/verify-backup-restore.sh
          ./scripts/verify-backup-restore.sh "$LATEST_LOCAL_BACKUP"
        env:
          VERIFY_DATABASE_URL: postgresql://restore_verifier:restore_verifier_password@localhost:5432/derm_restore_verify
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

      - name: Notify on failure
        if: ${{ failure() && env.SLACK_WEBHOOK != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: 'Database backup failed!'
          webhook_url: ${{ env.SLACK_WEBHOOK }}

      - name: Notify on success
        if: ${{ success() && env.SLACK_WEBHOOK != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: 'Database backup completed successfully'
          webhook_url: ${{ env.SLACK_WEBHOOK }}
