name: MIPS Cross-Browser Qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * *'

permissions:
  contents: read

concurrency:
  group: mips-cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mips_browser:
    name: MIPS Browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, Mobile Chrome, Mobile Safari]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --legacy-peer-deps --no-audit --no-fund

      - name: Install Playwright browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run MIPS browser qualification
        run: >-
          npx playwright test
          --config=e2e/playwright.config.ts
          mips-readiness-release.spec.ts
          --project="${{ matrix.project }}"
        env:
          CI: '1'
          PLAYWRIGHT_MOCK_AUTH: '1'
          PLAYWRIGHT_MOCK_DATA: '1'

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mips-browser-${{ matrix.project }}
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore
